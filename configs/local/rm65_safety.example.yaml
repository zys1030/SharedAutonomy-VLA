# Example local Cartesian safety schema for RM-65B.
# Copy to rm65_safety.local.yaml and replace every geometric placeholder with
# measurements from the target cell before enabling motion.
# Prefer nesting under cartesian_safety: (matches full local safety files).
# Flat top-level polygon_xy_m is also accepted by the loader.
# Do not commit the resulting local file.

cartesian_safety:
  polygon_xy_m:
    - [-0.10, -0.10]
    - [0.10, -0.10]
    - [0.10, 0.10]
    - [-0.10, 0.10]

  table_z_m: 0.0
  min_tool_clearance_m: 0.0
  tool_tip_offset_base_m: [0.0, 0.0, 0.0]

  min_flange_z_m: 0.0
  max_flange_z_m: null
