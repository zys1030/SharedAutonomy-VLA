# Template for configs/local/rm65_safety.local.yaml (machine-local; do not commit).
# Coordinates are in the robot base frame (metres).
#
# polygon_xy_m must be a convex polygon in boundary order. It is checked against
# the tool-tip XY (flange XY with vertical-down 178 mm offset), not the flange
# alone. Expand it when the pick/place layout changes; see
# docs/tasks/shape_pick_place_v1.md and scripts/check_workspace_pick_zone.py.

enable_motion: false
max_relative_target_deg: 1.0

cartesian_safety:
  fixed_tool_orientation: vertical_down
  # Stamp quadrilateral expanded 2026-07-27 to cover pick zone
  # x in [-0.42, -0.15], y in [-0.09, 0.17] plus ~20 mm margin.
  polygon_xy_m:
    - [-0.456, 0.107]
    - [-0.44, -0.11]
    - [-0.387, -0.236]
    - [-0.170, -0.420]
    - [-0.13, -0.11]
    - [-0.13, 0.19]
    - [-0.44, 0.19]
  tool_tip_offset_base_m: [0.0, 0.0, -0.178]
  table_z_m: 0.0
  min_tool_clearance_m: 0.0
  # Minimum flange Z in base frame. Lowering this allows the gripper tip to reach
  # closer to the table; 0.158 m = previous 0.178 m minus 20 mm (2026-07-27).
  min_flange_z_m: 0.158
  max_flange_z_m: null
