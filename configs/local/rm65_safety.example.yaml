# Example local Cartesian safety geometry for RM-65B.
# Copy structure into rm65_safety.local.yaml and adjust on the lab machine.
# Prefer nesting under cartesian_safety: (matches full local safety files).
# Flat top-level polygon_xy_m is also accepted by the loader.
# Do not commit real calibration overrides that encode secrets.

cartesian_safety:
  polygon_xy_m:
    - [-0.456, 0.107]
    - [-0.387, -0.236]
    - [-0.170, -0.420]
    - [-0.150, 0.068]

  table_z_m: 0.0
  min_tool_clearance_m: 0.0
  tool_tip_offset_base_m: [0.0, 0.0, -0.178]

  # Provisional conservative ceiling until a measured lab max height is finalized.
  max_flange_z_m: 0.45
