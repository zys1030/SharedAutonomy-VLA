# Compatibility template for configs/local/rm65_safety.local.yaml.
# Values below are placeholders and MUST be replaced with measurements from the
# target robot cell before enabling motion. Prefer the canonical template at
# configs/local/rm65_safety.example.yaml.

enable_motion: false
max_relative_target_deg: 1.0

cartesian_safety:
  fixed_tool_orientation: vertical_down
  # Convex polygon in robot-base metres; replace every point.
  polygon_xy_m:
    - [-0.10, -0.10]
    - [0.10, -0.10]
    - [0.10, 0.10]
    - [-0.10, 0.10]
  # Measured flange-to-tool-tip offset in robot-base metres.
  tool_tip_offset_base_m: [0.0, 0.0, 0.0]
  table_z_m: 0.0
  min_tool_clearance_m: 0.0
  min_flange_z_m: 0.0
  max_flange_z_m: null
